<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<title>Dinner Picker</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f2f5f0;--surface:#fff;--border:#e0e0dc;--text:#1a1a1a;--muted:#888;
  --accent:#2d6a4f;--accent-light:#e8f5ee;--accent-dark:#235c42;
  --danger:#c0392b;--radius:14px;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;
  padding:max(env(safe-area-inset-top),16px) 0 max(env(safe-area-inset-bottom),24px);}
.app{width:100%;max-width:480px;display:flex;flex-direction:column;gap:0;}
/* ── Header ── */
.header{padding:16px 20px 0;display:flex;flex-direction:column;gap:12px;}
.header h1{font-size:1.4rem;font-weight:800;letter-spacing:-.03em;text-align:center;color:var(--accent);}
/* ── Tabs ── */
.tab-bar{display:flex;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
.tab-btn{flex:1;padding:14px 4px;font-size:.78rem;font-weight:700;font-family:var(--font);
  background:none;border:none;cursor:pointer;color:var(--muted);
  border-bottom:3px solid transparent;transition:all .15s;-webkit-tap-highlight-color:transparent;}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}
/* ── Tab panels ── */
.tab-panel{display:none;padding:16px 16px 80px;flex-direction:column;gap:16px;}
.tab-panel.active{display:flex;}
/* ── Filter chips ── */
.filter-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:0 -16px;padding:0 16px;}
.filter-scroll::-webkit-scrollbar{display:none;}
.filter-row{display:flex;gap:8px;width:max-content;}
.chip{padding:8px 14px;border-radius:999px;border:1.5px solid var(--border);background:var(--surface);
  font-size:.82rem;font-weight:600;font-family:var(--font);color:var(--muted);cursor:pointer;
  white-space:nowrap;-webkit-tap-highlight-color:transparent;transition:all .15s;}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}
/* ── Cards ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
/* ── Pick result ── */
.result-box{width:100%;min-height:120px;background:var(--surface);border:2px solid var(--border);
  border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:20px;transition:border-color .2s,background .2s;gap:6px;}
.result-box.has-result{border-color:var(--accent);background:var(--accent-light);}
.result-name{font-size:1.7rem;font-weight:800;letter-spacing:-.03em;text-align:center;line-height:1.2;}
.result-cuisine-tag{font-size:.75rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;}
.result-placeholder{font-size:1rem;color:var(--muted);text-align:center;}
.result-actions{display:flex;gap:10px;align-items:center;}
/* ── Buttons ── */
.btn-primary{width:100%;padding:18px 16px;font-size:1.1rem;font-weight:800;font-family:var(--font);
  background:var(--accent);color:#fff;border:none;border-radius:var(--radius);cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:background .15s,transform .1s;user-select:none;}
.btn-primary:active{background:var(--accent-dark);transform:scale(.98);}
.btn-secondary{padding:12px 20px;font-size:.9rem;font-weight:700;font-family:var(--font);
  background:var(--surface);color:var(--accent);border:2px solid var(--accent);
  border-radius:var(--radius);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .15s;}
.btn-secondary:active{background:var(--accent-light);}
.btn-ghost{background:none;border:none;cursor:pointer;font-family:var(--font);
  -webkit-tap-highlight-color:transparent;transition:all .15s;}
/* ── Like/Dislike ── */
.vote-btn{padding:8px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);
  font-size:.9rem;font-weight:600;font-family:var(--font);cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:all .15s;display:flex;align-items:center;gap:5px;}
.vote-btn.liked{background:#e8f5ee;border-color:var(--accent);color:var(--accent);}
.vote-btn.disliked{background:#fdecea;border-color:var(--danger);color:var(--danger);}
/* ── Recent picks ── */
.picks-list{display:flex;flex-direction:column;gap:0;}
.pick-item{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.pick-item:last-child{border-bottom:none;}
.pick-item-name{font-size:.95rem;font-weight:600;}
.pick-item-time{font-size:.75rem;color:var(--muted);}
/* ── Meal list ── */
.meal-item{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border);gap:10px;}
.meal-item:last-child{border-bottom:none;}
.meal-info{flex:1;min-width:0;}
.meal-item-name{font-size:.95rem;font-weight:600;line-height:1.3;cursor:pointer;color:var(--accent);}
.meal-item-name:hover{text-decoration:underline;}
.meal-item-tag{font-size:.7rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
.meal-votes{display:flex;gap:4px;align-items:center;}
.small-vote{padding:5px 9px;border-radius:8px;border:1px solid var(--border);background:var(--surface);
  font-size:.75rem;font-weight:700;font-family:var(--font);cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:all .15s;}
.small-vote.liked{background:#e8f5ee;border-color:var(--accent);color:var(--accent);}
.small-vote.disliked{background:#fdecea;border-color:var(--danger);color:var(--danger);}
.icon-btn{padding:6px 8px;border-radius:8px;border:1px solid var(--border);background:var(--surface);
  font-size:.8rem;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .15s;flex-shrink:0;}
.icon-btn:active{background:var(--bg);}
/* ── Section header ── */
.section-hdr{display:flex;align-items:center;justify-content:space-between;}
.section-title{font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
/* ── Weekly planner ── */
.week-grid{display:flex;flex-direction:column;gap:8px;}
.day-row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:12px 14px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .15s;}
.day-row:active{background:var(--bg);}
.day-label{font-size:.8rem;font-weight:700;color:var(--muted);width:36px;flex-shrink:0;text-transform:uppercase;}
.day-meal{flex:1;font-size:.95rem;font-weight:600;}
.day-meal.empty{color:var(--muted);font-weight:400;}
.day-clear{padding:4px 8px;background:none;border:none;font-size:1rem;cursor:pointer;
  -webkit-tap-highlight-color:transparent;color:var(--muted);flex-shrink:0;}
/* ── Shopping list ── */
.shop-group{margin-bottom:12px;}
.shop-group-title{font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:.06em;margin-bottom:6px;padding:0 2px;}
.shop-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);}
.shop-item:last-child{border-bottom:none;}
.shop-check{width:20px;height:20px;border-radius:6px;border:2px solid var(--border);
  flex-shrink:0;margin-top:1px;cursor:pointer;appearance:none;-webkit-appearance:none;background:var(--surface);}
.shop-check:checked{background:var(--accent);border-color:var(--accent);}
.shop-check:checked::after{content:"✓";color:#fff;font-size:.7rem;display:flex;align-items:center;justify-content:center;height:100%;}
.shop-text{font-size:.92rem;line-height:1.4;}
/* ── IO row ── */
.io-row{display:flex;gap:10px;}
.io-btn{flex:1;padding:12px;font-size:.82rem;font-weight:700;font-family:var(--font);
  border-radius:var(--radius);border:1.5px solid var(--border);background:var(--surface);
  color:var(--text);cursor:pointer;text-align:center;-webkit-tap-highlight-color:transparent;transition:all .15s;}
.io-btn:active{background:var(--bg);}
/* ── Modals ── */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .25s;}
.modal-backdrop.open{opacity:1;pointer-events:all;}
.modal-sheet{background:var(--surface);border-radius:20px 20px 0 0;
  width:100%;max-width:480px;max-height:92dvh;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.32,1,.65,1);}
.modal-backdrop.open .modal-sheet{transform:translateY(0);}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 0;}
.modal-header{padding:16px 20px 12px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);}
.modal-title{font-size:1.1rem;font-weight:800;letter-spacing:-.02em;}
.modal-close{padding:6px;border-radius:8px;border:none;background:none;font-size:1.3rem;
  cursor:pointer;color:var(--muted);-webkit-tap-highlight-color:transparent;}
.modal-body{padding:16px 20px;overflow-y:auto;flex:1;}
.modal-footer{padding:12px 20px max(env(safe-area-inset-bottom),12px);border-top:1px solid var(--border);display:flex;gap:10px;}
/* ── Servings toggle ── */
.servings-row{display:flex;gap:8px;margin-bottom:16px;}
.srv-btn{flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);
  font-size:.9rem;font-weight:700;font-family:var(--font);cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:all .15s;text-align:center;}
.srv-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
/* ── Recipe ── */
.recipe-section-title{font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:.06em;margin:14px 0 8px;}
.ingredient-list{list-style:none;display:flex;flex-direction:column;gap:4px;}
.ingredient-list li{font-size:.92rem;padding:6px 0;border-bottom:1px solid var(--border);display:flex;gap:8px;}
.ingredient-list li:last-child{border-bottom:none;}
.ing-qty{font-weight:700;color:var(--accent);min-width:60px;flex-shrink:0;}
.steps-list{list-style:none;display:flex;flex-direction:column;gap:10px;}
.steps-list li{font-size:.9rem;line-height:1.5;display:flex;gap:10px;}
.step-num{font-weight:800;color:var(--accent);min-width:22px;flex-shrink:0;}
/* ── Edit modal ── */
.form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.form-label{font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
.form-input{padding:12px 14px;font-size:1rem;font-family:var(--font);background:var(--surface);
  border:1.5px solid var(--border);border-radius:10px;color:var(--text);outline:none;
  -webkit-appearance:none;transition:border-color .15s;}
.form-input:focus{border-color:var(--accent);}
textarea.form-input{resize:vertical;min-height:80px;line-height:1.5;}
select.form-input{cursor:pointer;}
/* ── Meal picker modal ── */
.meal-picker-list{display:flex;flex-direction:column;gap:0;}
.mp-item{padding:13px 4px;border-bottom:1px solid var(--border);display:flex;align-items:center;
  gap:10px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .15s;}
.mp-item:last-child{border-bottom:none;}
.mp-item:active{background:var(--bg);}
.mp-item-name{flex:1;font-size:.95rem;font-weight:600;}
.mp-item-tag{font-size:.7rem;font-weight:600;color:var(--muted);text-transform:uppercase;}
/* ── Empty state ── */
.empty-state{padding:32px 16px;text-align:center;color:var(--muted);font-size:.9rem;}
/* ── Animations ── */
@keyframes pop-in{0%{transform:scale(.85);opacity:0}70%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
.animate{animation:pop-in .28s ease-out both;}
@keyframes fade-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fade-in .2s ease-out both;}
/* ── Notes badge ── */
.notes-badge{display:inline-block;background:#fff3cd;border:1px solid #ffc107;color:#856404;
  font-size:.65rem;font-weight:700;padding:2px 6px;border-radius:4px;margin-left:4px;vertical-align:middle;}
.kid-badge{display:inline-block;background:#e8f5e9;border:1px solid #66bb6a;color:#2e7d32;
  font-size:.65rem;font-weight:700;padding:2px 6px;border-radius:4px;margin-left:4px;vertical-align:middle;}
.chip.kids{background:#e8f5e9;border-color:#66bb6a;color:#2e7d32;}
.chip.kids.active{background:#2e7d32;border-color:#2e7d32;color:#fff;}
.kid-check-row{display:flex;align-items:center;gap:8px;margin-top:4px;}
.kid-check-row input{width:18px;height:18px;accent-color:#2e7d32;cursor:pointer;}
.kid-check-row label{font-size:.9rem;color:var(--text);cursor:pointer;}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>Dinner Picker</h1>
    <div class="filter-scroll"><div class="filter-row" id="filterRow"></div></div>
    <div style="padding:4px 0 0"><button id="kidsChip1" class="chip kids" onclick="toggleKids(1)">🧒 Kids</button></div>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('pick')" id="tab-pick">Pick</button>
    <button class="tab-btn" onclick="switchTab('meals')" id="tab-meals">Meals</button>
    <button class="tab-btn" onclick="switchTab('planner')" id="tab-planner">Planner</button>
  </div>

  <!-- PICK TAB -->
  <div class="tab-panel active" id="panel-pick">
    <div class="result-box" id="resultBox">
      <p class="result-placeholder" id="resultPlaceholder">Tap "Pick Dinner" to get a suggestion</p>
      <p class="result-name" id="resultName" style="display:none"></p>
      <p class="result-cuisine-tag" id="resultCuisineTag" style="display:none"></p>
      <div class="result-actions" id="resultActions" style="display:none">
        <button class="vote-btn" id="pickLikeBtn" onclick="voteCurrentPick(1)">👍 Like</button>
        <button class="vote-btn" id="pickDislikeBtn" onclick="voteCurrentPick(-1)">👎</button>
        <button class="btn-ghost icon-btn" id="viewRecipeBtn" onclick="openRecipeModal()">📖</button>
      </div>
    </div>
    <button class="btn-primary" id="pickBtn" onclick="pickDinner()">Pick Dinner</button>
    <button class="btn-secondary" id="notTonightBtn" onclick="notTonight()" style="display:none">Not Tonight — Try Again</button>

    <div id="recentSection" style="display:none">
      <div class="section-hdr" style="margin-bottom:8px;">
        <span class="section-title">Recent Picks</span>
        <button class="btn-ghost" style="font-size:.8rem;color:var(--muted)" onclick="clearHistory()">Clear</button>
      </div>
      <div class="card picks-list" id="recentList"></div>
    </div>
  </div>

  <!-- MEALS TAB -->
  <div class="tab-panel" id="panel-meals">
    <div class="filter-scroll"><div class="filter-row" id="filterRow2"></div></div>
    <div style="padding:4px 0 0"><button id="kidsChip2" class="chip kids" onclick="toggleKids(2)">🧒 Kids</button></div>
    <div class="section-hdr">
      <span class="section-title">All Meals</span>
      <span class="section-title" id="mealCount"></span>
    </div>
    <div class="card" id="mealList"></div>
    <button class="btn-primary" onclick="openAddMealModal()">+ Add Meal</button>
    <div class="io-row">
      <button class="io-btn" onclick="exportData()">Export JSON</button>
      <button class="io-btn" onclick="document.getElementById('importFile').click()">Import JSON</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)"/>
    </div>
  </div>

  <!-- PLANNER TAB -->
  <div class="tab-panel" id="panel-planner">
    <div class="section-hdr">
      <span class="section-title">Weekly Planner</span>
    </div>
    <div class="week-grid" id="weekGrid"></div>
    <button class="btn-primary" onclick="openShoppingList()">Generate Shopping List</button>
  </div>
</div>

<!-- RECIPE MODAL -->
<div class="modal-backdrop" id="recipeModal" onclick="handleModalBackdrop(event,'recipeModal')">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <span class="modal-title" id="recipeModalTitle"></span>
      <button class="modal-close" onclick="closeModal('recipeModal')">×</button>
    </div>
    <div class="modal-body">
      <div class="servings-row">
        <button class="srv-btn" onclick="setServings(2)">2 servings</button>
        <button class="srv-btn active" onclick="setServings(4)">4 servings</button>
        <button class="srv-btn" onclick="setServings(6)">6 servings</button>
      </div>
      <p class="recipe-section-title">Ingredients</p>
      <ul class="ingredient-list" id="recipeIngredients"></ul>
      <p class="recipe-section-title">Steps</p>
      <ol class="steps-list" id="recipeSteps"></ol>
    </div>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="modal-backdrop" id="editModal" onclick="handleModalBackdrop(event,'editModal')">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <span class="modal-title">Edit Meal</span>
      <button class="modal-close" onclick="closeModal('editModal')">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Meal Name</label>
        <input class="form-input" id="editName" type="text"/>
      </div>
      <div class="form-group">
        <label class="form-label">Cuisine</label>
        <select class="form-input" id="editCuisine"></select>
      </div>
      <div class="form-group">
        <label class="form-label">Personal Notes</label>
        <textarea class="form-input" id="editNotes" placeholder="e.g. double the garlic, use panko breadcrumbs…"></textarea>
      </div>
      <div class="kid-check-row">
        <input type="checkbox" id="editKidFriendly"/>
        <label for="editKidFriendly">🧒 Kid Friendly</label>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal('editModal')" style="flex:1">Cancel</button>
      <button class="btn-primary" onclick="saveEdit()" style="flex:2">Save</button>
    </div>
  </div>
</div>

<!-- MEAL PICKER MODAL (for planner) -->
<div class="modal-backdrop" id="mealPickerModal" onclick="handleModalBackdrop(event,'mealPickerModal')">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <span class="modal-title" id="mealPickerTitle">Choose a Meal</span>
      <button class="modal-close" onclick="closeModal('mealPickerModal')">×</button>
    </div>
    <div class="modal-body">
      <div class="filter-scroll" style="margin:0 -20px;padding:0 20px 12px;">
        <div class="filter-row" id="filterRow3"></div>
      </div>
      <div style="padding:0 0 8px"><button id="kidsChip3" class="chip kids" onclick="toggleKids(3)">🧒 Kids</button></div>
      <div class="meal-picker-list" id="mealPickerList"></div>
    </div>
  </div>
</div>

<!-- SHOPPING LIST MODAL -->
<div class="modal-backdrop" id="shopModal" onclick="handleModalBackdrop(event,'shopModal')">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <span class="modal-title">Shopping List</span>
      <button class="modal-close" onclick="closeModal('shopModal')">×</button>
    </div>
    <div class="modal-body" id="shopModalBody"></div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="copyShoppingList()" style="flex:1">Copy</button>
      <button class="btn-primary" onclick="window.print()" style="flex:1">Print</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════
//  DINNER PICKER — App Script
// ═══════════════════════════════════════════════════════

const DEFAULT_MEALS = [
  {
    id:'m1',kidFriendly:true,name:'Spaghetti Bolognese',cuisine:'Italian',votes:0,notes:'',
    ingredients:[
      {qty:400,unit:'g',item:'spaghetti'},
      {qty:500,unit:'g',item:'ground beef'},
      {qty:1,unit:'can',item:'crushed tomatoes'},
      {qty:1,unit:'',item:'onion, diced'},
      {qty:3,unit:'cloves',item:'garlic, minced'},
      {qty:2,unit:'tbsp',item:'olive oil'},
      {qty:1,unit:'tsp',item:'dried oregano'},
      {qty:0,unit:'',item:'salt & pepper to taste'},
      {qty:0,unit:'',item:'parmesan, to serve'},
    ],
    steps:[
      'Heat olive oil in a large pan over medium heat. Sauté onion until soft, ~5 min.',
      'Add garlic and cook 1 min, then add ground beef and brown, breaking it up.',
      'Add crushed tomatoes and oregano. Simmer 20 min, season with salt & pepper.',
      'Cook spaghetti per package instructions. Drain and toss with sauce.',
      'Serve topped with grated parmesan.',
    ]
  },
  {
    id:'m2',name:'Chicken Tacos',cuisine:'Mexican',votes:0,notes:'',
    ingredients:[
      {qty:600,unit:'g',item:'chicken thighs'},
      {qty:2,unit:'tsp',item:'cumin'},
      {qty:1,unit:'tsp',item:'smoked paprika'},
      {qty:1,unit:'tsp',item:'chili powder'},
      {qty:8,unit:'',item:'small corn tortillas'},
      {qty:1,unit:'',item:'avocado, sliced'},
      {qty:1,unit:'',item:'lime, cut into wedges'},
      {qty:0,unit:'',item:'salsa, sour cream, cilantro to serve'},
    ],
    steps:[
      'Mix cumin, paprika, chili powder and rub over chicken thighs.',

// ── State ─────────────────────────────────────────────────
let state = {
  meals: [],
  history: [],         // [{id, name, cuisine, date}]
  planner: {},         // {Mon: mealId, ...}
  currentPickId: null,
  skippedIds: [],
  servings: 4,
  activeFilter: 'All',
  filterActive2: 'All',
  filterActive3: 'All',
  editingMealId: null,
  plannerDayEditing: null,
  kidFilter: false,
};

const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const STORAGE_KEY = 'dinnerPickerState';

// ── Persistence ───────────────────────────────────────────
function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    meals: state.meals,
    history: state.history,
    planner: state.planner,
  }));
}

function loadFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (Array.isArray(d.meals) && d.meals.length) state.meals = d.meals;
    if (Array.isArray(d.history)) state.history = d.history;
    if (d.planner && typeof d.planner === 'object') state.planner = d.planner;
  } catch(e) { console.warn('Failed to load state', e); }

  // Remove any default meals that were retired (Indian / Mediterranean).
  const retiredIds = new Set(['m3','m9','m11','m38','m39','m40','m41','m42','m48','m49','m50','m51','m52']);
  state.meals = state.meals.filter(m => !retiredIds.has(m.id));

  // Merge: add any DEFAULT_MEALS not yet in the saved list (by id), and
  // backfill kidFriendly + updated name/ingredients for swapped Asian meals.
  const swappedIds = new Set(['m4','m43','m44','m45','m46']);
  const savedIds = new Set(state.meals.map(m => m.id));
  for (const def of DEFAULT_MEALS) {
    if (!savedIds.has(def.id)) {
      state.meals.push(def);
    } else {
      const saved = state.meals.find(m => m.id === def.id);
      if (saved) {
        if (swappedIds.has(def.id)) {
          // Replace the whole meal so the new name/ingredients/steps land
          Object.assign(saved, def);
        } else if (saved.kidFriendly === undefined && def.kidFriendly) {
          saved.kidFriendly = true;
        }
      }
    }
  }
}

// ── Init ──────────────────────────────────────────────────
function init() {
  state.meals = JSON.parse(JSON.stringify(DEFAULT_MEALS));
  loadFromStorage();
  renderAll();
}

function renderAll() {
  renderFilters();
  renderPickTab();
  renderMealsTab();
  renderPlanner();
}

// ── Cuisines ──────────────────────────────────────────────
function getCuisines() {
  return ['All', ...new Set(state.meals.map(m => m.cuisine).sort())];
}

function renderFilters() {
  const cuisines = getCuisines();
  const configs = [
    {id:'filterRow',  active:state.activeFilter,  fn:'setFilter1'},
    {id:'filterRow2', active:state.filterActive2, fn:'setFilter2'},
    {id:'filterRow3', active:state.filterActive3, fn:'setFilter3'},
  ];
  configs.forEach(({id, active, fn}) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.innerHTML = cuisines.map(c =>
      `<button class="chip${active===c?' active':''}" onclick="${fn}('${esc(c)}')">${esc(c)}</button>`
    ).join('');
  });
  // Sync Kids chip state across all tabs
  [1,2,3].forEach(i => {
    const btn = document.getElementById('kidsChip'+i);
    if (btn) btn.classList.toggle('active', state.kidFilter);
  });
}

function setFilter1(c) { state.activeFilter = c; renderFilters(); }
function setFilter2(c) { state.filterActive2 = c; renderFilters(); renderMealsTab(); }
function setFilter3(c) { state.filterActive3 = c; renderFilters(); renderMealPickerList(); }

function toggleKids(tab) {
  state.kidFilter = !state.kidFilter;
  renderFilters();
  if (tab === 2) renderMealsTab();
  else if (tab === 3) renderMealPickerList();
}

// ── Tabs ──────────────────────────────────────────────────
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  document.getElementById('panel-'+tab).classList.add('active');
}

// ── Pick tab ──────────────────────────────────────────────
function pickDinner() {
  const eligible = state.meals.filter(m =>
    (state.activeFilter === 'All' || m.cuisine === state.activeFilter) &&
    (!state.kidFilter || m.kidFriendly) &&
    !state.skippedIds.includes(m.id)
  );
  if (!eligible.length) {
    state.skippedIds = [];
    alert('You\'ve gone through all meals! Starting fresh.');
    pickDinner();
    return;
  }
  // Weighted random: down-weight recent, boost liked
  const recentIds = state.history.slice(0, 5).map(h => h.id);
  const weighted = eligible.map(m => ({
    m,
    w: (recentIds.includes(m.id) ? 0.25 : 1) * Math.max(0.1, 1 + m.votes * 0.15)
  }));
  const total = weighted.reduce((s, x) => s + x.w, 0);
  let r = Math.random() * total;
  let picked = weighted[weighted.length - 1].m;
  for (const {m, w} of weighted) { r -= w; if (r <= 0) { picked = m; break; } }

  state.currentPickId = picked.id;
  state.skippedIds.push(picked.id);
  renderPickResult();
}

function notTonight() { pickDinner(); }

function voteCurrentPick(v) {
  if (!state.currentPickId) return;
  const meal = state.meals.find(m => m.id === state.currentPickId);
  if (!meal) return;
  meal.votes = meal.votes === v ? 0 : v;
  if (meal.votes === 1) {
    // Add to history on like
    state.history = [
      {id: meal.id, name: meal.name, cuisine: meal.cuisine, date: new Date().toISOString()},
      ...state.history.filter(h => h.id !== meal.id)
    ].slice(0, 20);
  }
  save();
  renderPickResult();
}

function clearHistory() {
  if (!confirm('Clear recent pick history?')) return;
  state.history = [];
  save();
  renderPickTab();
}

function renderPickResult() {
  const meal = state.currentPickId ? state.meals.find(m => m.id === state.currentPickId) : null;
  const box          = document.getElementById('resultBox');
  const placeholder  = document.getElementById('resultPlaceholder');
  const nameEl       = document.getElementById('resultName');
  const tagEl        = document.getElementById('resultCuisineTag');
  const actions      = document.getElementById('resultActions');
  const notTonight   = document.getElementById('notTonightBtn');

  if (meal) {
    box.classList.add('has-result');
    placeholder.style.display = 'none';
    nameEl.style.display = tagEl.style.display = actions.style.display = notTonight.style.display = '';
    nameEl.textContent = meal.name;
    nameEl.classList.remove('animate');
    void nameEl.offsetWidth; // reflow
    nameEl.classList.add('animate');
    tagEl.textContent = meal.cuisine;
    document.getElementById('pickLikeBtn').className    = 'vote-btn' + (meal.votes === 1  ? ' liked'    : '');
    document.getElementById('pickDislikeBtn').className = 'vote-btn' + (meal.votes === -1 ? ' disliked' : '');
  } else {
    box.classList.remove('has-result');
    placeholder.style.display = '';
    nameEl.style.display = tagEl.style.display = actions.style.display = notTonight.style.display = 'none';
  }
}

function renderPickTab() {
  renderPickResult();
  const recentSection = document.getElementById('recentSection');
  const recentList    = document.getElementById('recentList');
  if (state.history.length) {
    recentSection.style.display = '';
    recentList.innerHTML = state.history.slice(0, 8).map(h =>
      `<div class="pick-item fade-in">
        <span class="pick-item-name">${esc(h.name)}</span>
        <span class="pick-item-time">${formatDate(new Date(h.date))}</span>
      </div>`
    ).join('');
  } else {
    recentSection.style.display = 'none';
  }
}

// ── Meals tab ─────────────────────────────────────────────
function renderMealsTab() {
  const filtered = state.meals
    .filter(m =>
      (state.filterActive2 === 'All' || m.cuisine === state.filterActive2) &&
      (!state.kidFilter || m.kidFriendly)
    )
    .sort((a, b) => a.name.localeCompare(b.name));

  document.getElementById('mealCount').textContent =
    `${filtered.length} meal${filtered.length !== 1 ? 's' : ''}`;

  document.getElementById('mealList').innerHTML = filtered.length
    ? filtered.map(m => `
      <div class="meal-item">
        <div class="meal-info">
          <div class="meal-item-name" onclick="openRecipeModalFor('${m.id}')">${esc(m.name)}${m.notes ? '<span class="notes-badge">note</span>' : ''}${m.kidFriendly ? '<span class="kid-badge">K</span>' : ''}</div>
          <div class="meal-item-tag">${esc(m.cuisine)}</div>
        </div>
        <div class="meal-votes">
          <button class="small-vote${m.votes === 1 ? ' liked' : ''}"    onclick="voteMeal('${m.id}', 1)">👍</button>
          <button class="small-vote${m.votes === -1 ? ' disliked' : ''}" onclick="voteMeal('${m.id}',-1)">👎</button>
        </div>
        <button class="icon-btn" onclick="openEditModal('${m.id}')" title="Edit">✏️</button>
        <button class="icon-btn" onclick="deleteMeal('${m.id}')" title="Delete">🗑️</button>
      </div>`
    ).join('')
    : '<div class="empty-state">No meals found.</div>';
}

function voteMeal(id, v) {
  const meal = state.meals.find(m => m.id === id);
  if (!meal) return;
  meal.votes = meal.votes === v ? 0 : v;
  save();
  renderMealsTab();
}

function deleteMeal(id) {
  if (!confirm('Delete this meal?')) return;
  state.meals = state.meals.filter(m => m.id !== id);
  DAYS.forEach(d => { if (state.planner[d] === id) delete state.planner[d]; });
  if (state.currentPickId === id) { state.currentPickId = null; renderPickResult(); }
  save();
  renderFilters();
  renderMealsTab();
  renderPlanner();
}

  state.editingMealId = null;
  document.querySelector('#editModal .modal-title').textContent = 'Add Meal';
  document.getElementById('editName').value = '';
  document.getElementById('editNotes').value = '';
  document.getElementById('editKidFriendly').checked = false;
  populateCuisineSelect(null);
  openModal('editModal');
}

function openEditModal(id) {
  const meal = state.meals.find(m => m.id === id);
  state.editingMealId = id;
  document.querySelector('#editModal .modal-title').textContent = 'Edit Meal';
  document.getElementById('editName').value  = meal?.name  || '';
  document.getElementById('editNotes').value = meal?.notes || '';
  document.getElementById('editKidFriendly').checked = meal?.kidFriendly || false;
  populateCuisineSelect(meal?.cuisine || null);
  openModal('editModal');
}

function populateCuisineSelect(current) {
  const sel = document.getElementById('editCuisine');
  const list = getCuisines().filter(c => c !== 'All');
  sel.innerHTML = list.map(c =>
    `<option${current === c ? ' selected' : ''}>${esc(c)}</option>`
  ).join('') + '<option value="__new__">+ New cuisine…</option>';
}

function saveEdit() {
  const name = document.getElementById('editName').value.trim();
  if (!name) { alert('Please enter a meal name.'); return; }
  let cuisine = document.getElementById('editCuisine').value;
  if (cuisine === '__new__') {
    cuisine = (prompt('New cuisine name:') || '').trim() || 'Other';
  }
  const notes = document.getElementById('editNotes').value.trim();
  const kidFriendly = document.getElementById('editKidFriendly').checked;

  if (state.editingMealId) {
    const meal = state.meals.find(m => m.id === state.editingMealId);
    if (meal) { meal.name = name; meal.cuisine = cuisine; meal.notes = notes; meal.kidFriendly = kidFriendly; }
  } else {
    state.meals.push({ id: 'm' + Date.now(), name, cuisine, votes: 0, notes, kidFriendly, ingredients: [], steps: [] });
  }
  save();
  closeModal('editModal');
  renderAll();
}

// ── Recipe modal ──────────────────────────────────────────
function openRecipeModal() {
  if (state.currentPickId) openRecipeModalFor(state.currentPickId);
}

function openRecipeModalFor(id) {
  const meal = state.meals.find(m => m.id === id);
  if (!meal) return;
  // Store id on modal for servings re-render
  document.getElementById('recipeModal').dataset.mealId = id;
  document.getElementById('recipeModalTitle').textContent = meal.name;
  // Reset servings buttons
  document.querySelectorAll('.srv-btn').forEach(b =>
    b.classList.toggle('active', parseInt(b.textContent) === state.servings)
  );
  renderRecipeIngredients(meal);
  renderRecipeSteps(meal);
  openModal('recipeModal');
}

function setServings(n) {
  state.servings = n;
  document.querySelectorAll('.srv-btn').forEach(b =>
    b.classList.toggle('active', parseInt(b.textContent) === n)
  );
  const id = document.getElementById('recipeModal').dataset.mealId;
  const meal = id ? state.meals.find(m => m.id === id) : null;
  if (meal) renderRecipeIngredients(meal);
}

function renderRecipeIngredients(meal) {
  const factor = state.servings / 4;
  const el = document.getElementById('recipeIngredients');
  if (!meal.ingredients?.length) {
    el.innerHTML = '<li style="color:var(--muted);font-size:.9rem">No ingredients listed yet.</li>';
    return;
  }
  el.innerHTML = meal.ingredients.map(ing => {
    let qtyStr = '';
    if (ing.qty) {
      const scaled = ing.qty * factor;
      const fmt = Number.isInteger(scaled) ? String(scaled) : scaled.toFixed(1).replace(/\.0$/, '');
      qtyStr = ing.unit ? `${fmt} ${ing.unit}` : fmt;
    }
    return `<li><span class="ing-qty">${esc(qtyStr)}</span><span>${esc(ing.item)}</span></li>`;
  }).join('');
}

function renderRecipeSteps(meal) {
  const el = document.getElementById('recipeSteps');
  if (!meal.steps?.length) {
    el.innerHTML = '<li style="color:var(--muted);font-size:.9rem"><span class="step-num">—</span><span>No steps listed yet.</span></li>';
    return;
  }
  el.innerHTML = meal.steps.map((s, i) =>
    `<li><span class="step-num">${i + 1}</span><span>${esc(s)}</span></li>`
  ).join('');
}

// ── Planner ───────────────────────────────────────────────
function renderPlanner() {
  document.getElementById('weekGrid').innerHTML = DAYS.map(day => {
    const mealId = state.planner[day];
    const meal   = mealId ? state.meals.find(m => m.id === mealId) : null;
    return `<div class="day-row" onclick="openMealPicker('${day}')">
      <span class="day-label">${day}</span>
      <span class="day-meal${meal ? '' : ' empty'}">${meal ? esc(meal.name) : 'Tap to add…'}</span>
      ${meal ? `<button class="day-clear" onclick="clearDay(event,'${day}')" title="Remove">×</button>` : ''}
    </div>`;
  }).join('');
}

function clearDay(e, day) {
  e.stopPropagation();
  delete state.planner[day];
  save();
  renderPlanner();
}

function openMealPicker(day) {
  state.plannerDayEditing = day;
  state.filterActive3 = 'All';
  document.getElementById('mealPickerTitle').textContent = `Choose meal for ${day}`;
  renderFilters();
  renderMealPickerList();
  openModal('mealPickerModal');
}

function renderMealPickerList() {
  const filtered = state.meals
    .filter(m =>
      (state.filterActive3 === 'All' || m.cuisine === state.filterActive3) &&
      (!state.kidFilter || m.kidFriendly)
    )
    .sort((a, b) => a.name.localeCompare(b.name));

  document.getElementById('mealPickerList').innerHTML = filtered.length
    ? filtered.map(m =>
        `<div class="mp-item" onclick="assignMeal('${m.id}')">
          <span class="mp-item-name">${esc(m.name)}${m.kidFriendly ? '<span class="kid-badge">K</span>' : ''}</span>
          <span class="mp-item-tag">${esc(m.cuisine)}</span>
        </div>`
      ).join('')
    : '<div class="empty-state">No meals found.</div>';
}

function assignMeal(mealId) {
  if (state.plannerDayEditing) {
    state.planner[state.plannerDayEditing] = mealId;
    save();
    renderPlanner();
  }
  closeModal('mealPickerModal');
}

// ── Shopping list ─────────────────────────────────────────
function openShoppingList() {
  const meals = DAYS
    .map(d => state.planner[d])
    .filter(Boolean)
    .map(id => state.meals.find(m => m.id === id))
    .filter(Boolean);

  if (!meals.length) { alert('Add meals to your planner first!'); return; }

  document.getElementById('shopModalBody').innerHTML = meals.map(meal => {
    if (!meal.ingredients?.length) return `<div class="shop-group"><div class="shop-group-title">${esc(meal.name)}</div><p style="color:var(--muted);font-size:.85rem;padding:4px 0">No ingredients listed.</p></div>`;
    return `<div class="shop-group">
      <div class="shop-group-title">${esc(meal.name)}</div>
      ${meal.ingredients.map((ing, i) => {
        let label = ing.item;
        if (ing.qty) {
          const fmt = Number.isInteger(ing.qty) ? String(ing.qty) : ing.qty.toFixed(1);
          label = `${fmt}${ing.unit ? ' ' + ing.unit : ''} ${label}`;
        }
        return `<div class="shop-item">
          <input type="checkbox" class="shop-check" id="sc-${meal.id}-${i}"/>
          <label class="shop-text" for="sc-${meal.id}-${i}">${esc(label)}</label>
        </div>`;
      }).join('')}
    </div>`;
  }).join('');

  openModal('shopModal');
}

function copyShoppingList() {
  const meals = DAYS
    .map(d => state.planner[d])
    .filter(Boolean)
    .map(id => state.meals.find(m => m.id === id))
    .filter(Boolean);

  const lines = meals.flatMap(meal => {
    const header = `\n${meal.name}:`;
    if (!meal.ingredients?.length) return [header, '  (no ingredients)'];
    return [header, ...meal.ingredients.map(ing => {
      const fmt = ing.qty ? `${ing.qty}${ing.unit ? ' ' + ing.unit : ''} ` : '';
      return `  • ${fmt}${ing.item}`;
    })];
  });

  navigator.clipboard?.writeText(lines.join('\n').trim())
    .then(() => alert('Copied to clipboard!'))
    .catch(() => alert('Copy failed — try selecting text manually.'));
}

// ── Import / Export ───────────────────────────────────────
function exportData() {
  const json = JSON.stringify({meals: state.meals, history: state.history, planner: state.planner}, null, 2);
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(new Blob([json], {type:'application/json'})),
    download: 'dinner-picker.json',
  });
  a.click();
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const d = JSON.parse(ev.target.result);
      if (Array.isArray(d.meals)) state.meals = d.meals;
      if (Array.isArray(d.history)) state.history = d.history;
      if (d.planner) state.planner = d.planner;
      save();
      renderAll();
      alert('Import successful!');
    } catch { alert('Invalid JSON file.'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

// ── Modals ────────────────────────────────────────────────
function openModal(id) {
  document.getElementById(id).classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal(id) {
  document.getElementById(id).classList.remove('open');
  document.body.style.overflow = '';
}

function handleModalBackdrop(e, id) {
  if (e.target === document.getElementById(id)) closeModal(id);
}

// ── Helpers ───────────────────────────────────────────────
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatDate(d) {
  const diff = Math.floor((Date.now() - d.getTime()) / 86400000);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  if (diff < 7)  return `${diff}d ago`;
  return d.toLocaleDateString(undefined, {month:'short', day:'numeric'});
}

// ── Boot ──────────────────────────────────────────────────
init();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Dinner Picker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f9f9f7;
      --surface: #ffffff;
      --border: #e0e0dc;
      --text: #1a1a1a;
      --muted: #888;
      --accent: #2d6a4f;
      --accent-light: #e8f5ee;
      --danger: #c0392b;
      --radius: 14px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: max(env(safe-area-inset-top), 24px) 20px env(safe-area-inset-bottom, 24px);
    }

    .app {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      text-align: center;
    }

    /* ── Cuisine filter ── */
    .filter-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      margin: 0 -20px;
      padding: 0 20px;
    }
    .filter-scroll::-webkit-scrollbar { display: none; }

    .filter-row {
      display: flex;
      gap: 8px;
      width: max-content;
    }

    .filter-chip {
      padding: 8px 16px;
      border-radius: 999px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      font-size: 0.9rem;
      font-weight: 600;
      font-family: var(--font);
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
      transition: all 0.15s;
    }

    .filter-chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* ── Pick section ── */
    .pick-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .result-box {
      width: 100%;
      min-height: 110px;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: border-color 0.2s, background 0.2s;
      gap: 6px;
    }

    .result-box.has-result {
      border-color: var(--accent);
      background: var(--accent-light);
    }

    .result-text {
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      text-align: center;
      color: var(--text);
      line-height: 1.2;
    }

    .result-cuisine {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .result-placeholder {
      font-size: 1rem;
      color: var(--muted);
      text-align: center;
    }

    .pick-btn {
      width: 100%;
      padding: 20px 16px;
      font-size: 1.2rem;
      font-weight: 700;
      font-family: var(--font);
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s, transform 0.1s;
      user-select: none;
    }

    .pick-btn:active { background: #235c42; transform: scale(0.98); }

    /* ── List section ── */
    .list-section { display: flex; flex-direction: column; gap: 12px; }

    .list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .section-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .meal-count { font-size: 0.8rem; color: var(--muted); }

    .meal-list {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .meal-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      gap: 10px;
    }
    .meal-item:last-child { border-bottom: none; }

    .meal-info { flex: 1; min-width: 0; }

    .meal-name {
      font-size: 1rem;
      font-weight: 500;
      line-height: 1.3;
    }

    .meal-tag {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .remove-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      font-size: 1.3rem;
      line-height: 1;
      padding: 4px 6px;
      border-radius: 6px;
      -webkit-tap-highlight-color: transparent;
      transition: color 0.15s;
      flex-shrink: 0;
    }
    .remove-btn:active { color: var(--danger); }

    /* ── Add form ── */
    .add-form { display: flex; gap: 10px; }

    .add-input {
      flex: 1;
      padding: 13px 16px;
      font-size: 1rem;
      font-family: var(--font);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      outline: none;
      -webkit-appearance: none;
      transition: border-color 0.15s;
    }
    .add-input:focus { border-color: var(--accent); }
    .add-input::placeholder { color: var(--muted); }

    .cuisine-select {
      padding: 13px 10px;
      font-size: 0.9rem;
      font-family: var(--font);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      outline: none;
      cursor: pointer;
      max-width: 110px;
    }

    .add-btn {
      padding: 13px 20px;
      font-size: 1rem;
      font-weight: 700;
      font-family: var(--font);
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s, transform 0.1s;
      flex-shrink: 0;
    }
    .add-btn:active { background: #235c42; transform: scale(0.97); }

    .empty-state {
      padding: 28px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
    }

    /* ── Import/Export ── */
    .io-row { display: flex; gap: 10px; }

    .io-btn {
      flex: 1;
      padding: 11px;
      font-size: 0.85rem;
      font-weight: 600;
      font-family: var(--font);
      border-radius: var(--radius);
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      text-align: center;
      -webkit-tap-highlight-color: transparent;
      transition: all 0.15s;
    }
    .io-btn:active { background: var(--bg); }

    /* ── Animation ── */
    @keyframes pop-in {
      0%   { transform: scale(0.85); opacity: 0; }
      70%  { transform: scale(1.04); }
      100% { transform: scale(1);    opacity: 1; }
    }
    .animate { animation: pop-in 0.28s ease-out both; }
  </style>
</head>
<body>
<div class="app">
  <h1>🍽 Dinner Picker</h1>

  <!-- Cuisine filter chips -->
  <div class="filter-scroll">
    <div class="filter-row" id="filterRow"></div>
  </div>

  <!-- Pick -->
  <div class="pick-section">
    <div class="result-box" id="resultBox">
      <p class="result-placeholder" id="placeholder">Tap the button to pick tonight's dinner</p>
      <p class="result-text" id="resultText" style="display:none"></p>
      <p class="result-cuisine" id="resultCuisine" style="display:none"></p>
    </div>
    <button class="pick-btn" id="pickBtn">Pick Dinner</button>
  </div>

  <!-- Meal list -->
  <div class="list-section">
    <div class="list-header">
      <span class="section-title">Meal List</span>
      <span class="meal-count" id="mealCount"></span>
    </div>

    <div class="add-form">
      <input class="add-input" id="addInput" type="text" placeholder="Meal name…"
        autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done" />
      <select class="cuisine-select" id="cuisineSelect"></select>
      <button class="add-btn" id="addBtn">Add</button>
    </div>

    <div class="meal-list" id="mealList"></div>

    <div class="io-row">
      <button class="io-btn" id="exportBtn">⬇ Export JSON</button>
      <button class="io-btn" id="importBtn">⬆ Import JSON</button>
      <input type="file" id="importFile" accept=".json" style="display:none" />
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'dinner-picker-meals-v2';
  const CUISINES = ['American', 'Mexican', 'Italian', 'Asian', 'Comfort'];

  const DEFAULT_MEALS = [
    // American
    { name: 'Burgers',                    cuisine: 'American' },
    { name: 'BBQ Ribs',                   cuisine: 'American' },
    { name: 'Fried Chicken',              cuisine: 'American' },
    { name: 'Meatloaf',                   cuisine: 'American' },
    { name: 'Pot Roast',                  cuisine: 'American' },
    { name: 'Grilled Steak',              cuisine: 'American' },
    { name: 'Chili',                      cuisine: 'American' },
    { name: 'Pulled Pork Sandwiches',     cuisine: 'American' },
    { name: 'Sloppy Joes',                cuisine: 'American' },
    { name: 'Breakfast for Dinner',       cuisine: 'American' },
    // Mexican
    { name: 'Tacos',                      cuisine: 'Mexican' },
    { name: 'Chicken Fajitas',            cuisine: 'Mexican' },
    { name: 'Beef Burritos',              cuisine: 'Mexican' },
    { name: 'Enchiladas',                 cuisine: 'Mexican' },
    { name: 'Quesadillas',                cuisine: 'Mexican' },
    { name: 'Taco Salad',                 cuisine: 'Mexican' },
    { name: 'Carne Asada',                cuisine: 'Mexican' },
    { name: 'Chile Verde',                cuisine: 'Mexican' },
    { name: 'Tamales',                    cuisine: 'Mexican' },
    { name: 'Carnitas Bowls',             cuisine: 'Mexican' },
    // Italian
    { name: 'Spaghetti & Meatballs',      cuisine: 'Italian' },
    { name: 'Lasagna',                    cuisine: 'Italian' },
    { name: 'Chicken Parmesan',           cuisine: 'Italian' },
    { name: 'Chicken Alfredo',            cuisine: 'Italian' },
    { name: 'Pizza',                      cuisine: 'Italian' },
    { name: 'Baked Ziti',                 cuisine: 'Italian' },
    { name: 'Chicken Piccata',            cuisine: 'Italian' },
    { name: 'Meatball Subs',              cuisine: 'Italian' },
    { name: 'Chicken Marsala',            cuisine: 'Italian' },
    { name: 'Sausage & Peppers',          cuisine: 'Italian' },
    // Asian
    { name: 'Beef Stir Fry',              cuisine: 'Asian' },
    { name: 'Orange Chicken',             cuisine: 'Asian' },
    { name: 'Chicken Fried Rice',         cuisine: 'Asian' },
    { name: 'Beef & Broccoli',            cuisine: 'Asian' },
    { name: "General Tso's Chicken",      cuisine: 'Asian' },
    { name: 'Teriyaki Chicken Bowls',     cuisine: 'Asian' },
    { name: 'Honey Garlic Chicken',       cuisine: 'Asian' },
    { name: 'Mongolian Beef',             cuisine: 'Asian' },
    { name: 'Kung Pao Chicken',           cuisine: 'Asian' },
    { name: 'Sweet & Sour Pork',          cuisine: 'Asian' },
    // Comfort
    { name: 'Mac & Cheese with Bacon',    cuisine: 'Comfort' },
    { name: 'Chicken Noodle Soup',        cuisine: 'Comfort' },
    { name: 'Beef Stew',                  cuisine: 'Comfort' },
    { name: 'Pork Chops',                 cuisine: 'Comfort' },
    { name: 'Chicken & Rice Casserole',   cuisine: 'Comfort' },
    { name: 'Chicken Pot Pie',            cuisine: 'Comfort' },
    { name: 'Philly Cheesesteak',         cuisine: 'Comfort' },
    { name: 'French Dip Sandwich',        cuisine: 'Comfort' },
    { name: 'Chicken Tenders',            cuisine: 'Comfort' },
    { name: 'Chorizo Breakfast Burritos', cuisine: 'Comfort' },
  ];

  // ── State ──────────────────────────────────────────────────────────────
  function loadMeals() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed) && parsed.length > 0) return parsed;
      }
    } catch (_) {}
    return DEFAULT_MEALS.map(m => ({ ...m }));
  }

  function saveMeals() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(meals)); } catch (_) {}
  }

  let meals = loadMeals();
  let activeFilter = 'All';

  function escapeHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function filteredMeals() {
    return activeFilter === 'All' ? meals : meals.filter(m => m.cuisine === activeFilter);
  }

  // ── Render ─────────────────────────────────────────────────────────────
  function renderFilters() {
    const row = document.getElementById('filterRow');
    row.innerHTML = ['All', ...CUISINES].map(c => `
      <button class="filter-chip${c === activeFilter ? ' active' : ''}" onclick="setFilter('${c}')">${c}</button>
    `).join('');
  }

  function renderCuisineSelect() {
    const sel = document.getElementById('cuisineSelect');
    sel.innerHTML = CUISINES.map(c => `<option value="${c}">${c}</option>`).join('');
  }

  function renderList() {
    const list = document.getElementById('mealList');
    const count = document.getElementById('mealCount');
    const visible = filteredMeals();

    count.textContent = `${visible.length} meal${visible.length !== 1 ? 's' : ''}`;

    if (visible.length === 0) {
      list.innerHTML = '<p class="empty-state">No meals in this category</p>';
      return;
    }

    list.innerHTML = visible.map(meal => {
      const idx = meals.indexOf(meal);
      return `
        <div class="meal-item">
          <div class="meal-info">
            <div class="meal-name">${escapeHtml(meal.name)}</div>
            <div class="meal-tag">${escapeHtml(meal.cuisine)}</div>
          </div>
          <button class="remove-btn" aria-label="Remove" onclick="removeMeal(${idx})">×</button>
        </div>`;
    }).join('');
  }

  // ── Actions ────────────────────────────────────────────────────────────
  function setFilter(cuisine) {
    activeFilter = cuisine;
    renderFilters();
    renderList();
  }

  function pickDinner() {
    const pool = filteredMeals();
    if (pool.length === 0) { alert('No meals in this category!'); return; }

    const meal = pool[Math.floor(Math.random() * pool.length)];
    const box = document.getElementById('resultBox');
    const placeholder = document.getElementById('placeholder');
    const oldText = document.getElementById('resultText');
    const cuisineEl = document.getElementById('resultCuisine');

    placeholder.style.display = 'none';

    const freshText = oldText.cloneNode(false);
    freshText.id = 'resultText';
    freshText.textContent = meal.name;
    freshText.classList.add('animate');
    freshText.style.display = 'block';
    oldText.replaceWith(freshText);

    cuisineEl.textContent = meal.cuisine;
    cuisineEl.style.display = 'block';
    box.classList.add('has-result');
  }

  function addMeal() {
    const input = document.getElementById('addInput');
    const sel = document.getElementById('cuisineSelect');
    const name = input.value.trim();
    if (!name) return;

    if (meals.some(m => m.name.toLowerCase() === name.toLowerCase())) {
      input.value = ''; input.focus(); return;
    }

    meals.push({ name, cuisine: sel.value });
    saveMeals();
    renderList();
    input.value = '';
    input.focus();
  }

  function removeMeal(index) {
    meals.splice(index, 1);
    saveMeals();
    renderList();
  }

  function exportMeals() {
    const blob = new Blob([JSON.stringify(meals, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'dinner-meals.json';
    a.click();
    URL.revokeObjectURL(url);
  }

  function importMeals(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = evt => {
      try {
        const parsed = JSON.parse(evt.target.result);
        if (!Array.isArray(parsed)) throw new Error();
        meals = parsed.map(m => typeof m === 'string'
          ? { name: m, cuisine: 'American' }
          : { name: String(m.name || ''), cuisine: String(m.cuisine || 'American') }
        ).filter(m => m.name);
        saveMeals();
        renderList();
      } catch (_) { alert('Invalid JSON file.'); }
    };
    reader.readAsText(file);
    e.target.value = '';
  }

  // ── Events ─────────────────────────────────────────────────────────────
  document.getElementById('pickBtn').addEventListener('click', pickDinner);
  document.getElementById('addBtn').addEventListener('click', addMeal);
  document.getElementById('addInput').addEventListener('keydown', e => { if (e.key === 'Enter') addMeal(); });
  document.getElementById('exportBtn').addEventListener('click', exportMeals);
  document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFile').click());
  document.getElementById('importFile').addEventListener('change', importMeals);

  // ── Init ───────────────────────────────────────────────────────────────
  renderFilters();
  renderCuisineSelect();
  renderList();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<title>Dinner Picker</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f2f5f0;--surface:#fff;--border:#e0e0dc;--text:#1a1a1a;--muted:#888;
  --accent:#2d6a4f;--accent-light:#e8f5ee;--accent-dark:#235c42;
  --danger:#c0392b;--radius:14px;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;
  padding:max(env(safe-area-inset-top),16px) 0 max(env(safe-area-inset-bottom),24px);}
.app{width:100%;max-width:480px;display:flex;flex-direction:column;gap:0;}
/* ── Header ── */
.header{padding:16px 20px 0;display:flex;flex-direction:column;gap:12px;}
.header h1{font-size:1.4rem;font-weight:800;letter-spacing:-.03em;text-align:center;color:var(--accent);}
/* ── Tabs ── */
.tab-bar{display:flex;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
.tab-btn{flex:1;padding:14px 4px;font-size:.78rem;font-weight:700;font-family:var(--font);
  background:none;border:none;cursor:pointer;color:var(--muted);
  border-bottom:3px solid transparent;transition:all .15s;-webkit-tap-highlight-color:transparent;}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}
/* ── Tab panels ── */
.tab-panel{display:none;padding:16px 16px 80px;flex-direction:column;gap:16px;}
.tab-panel.active{display:flex;}
/* ── Filter chips ── */
.filter-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:0 -16px;padding:0 16px;}
.filter-scroll::-webkit-scrollbar{display:none;}
.filter-row{display:flex;gap:8px;width:max-content;}
.chip{padding:8px 14px;border-radius:999px;border:1.5px solid var(--border);background:var(--surface);
  font-size:.82rem;font-weight:600;font-family:var(--font);color:var(--muted);cursor:pointer;
  white-space:nowrap;-webkit-tap-highlight-color:transparent;transition:all .15s;}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}
/* ── Cards ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
/* ── Pick result ── */
.result-box{width:100%;min-height:120px;background:var(--surface);border:2px solid var(--border);
  border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:20px;transition:border-color .2s,background .2s;gap:6px;}
.result-box.has-result{border-color:var(--accent);background:var(--accent-light);}
.result-name{font-size:1.7rem;font-weight:800;letter-spacing:-.03em;text-align:center;line-height:1.2;}
.result-cuisine-tag{font-size:.75rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;}
.result-placeholder{font-size:1rem;color:var(--muted);text-align:center;}
.result-actions{display:flex;gap:10px;align-items:center;}
/* ── Buttons ── */
.btn-primary{width:100%;padding:18px 16px;font-size:1.1rem;font-weight:800;font-family:var(--font);
  background:var(--accent);color:#fff;border:none;border-radius:var(--radius);cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:background .15s,transform .1s;user-select:none;}
.btn-primary:active{background:var(--accent-dark);transform:scale(.98);}
.btn-secondary{padding:12px 20px;font-size:.9rem;font-weight:700;font-family:var(--font);
  background:var(--surface);color:var(--accent);border:2px solid var(--accent);
  border-radius:var(--radius);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .15s;}
.btn-secondary:active{background:var(--accent-light);}
.btn-ghost{background:none;border:none;cursor:pointer;font-family:var(--font);
  -webkit-tap-highlight-color:transparent;transition:all .15s;}
/* ── Like/Dislike ── */
.vote-btn{padding:8px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);
  font-size:.9rem;font-weight:600;font-family:var(--font);cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:all .15s;display:flex;align-items:center;gap:5px;}
.vote-btn.liked{background:#e8f5ee;border-color:var(--accent);color:var(--accent);}
.vote-btn.disliked{background:#fdecea;border-color:var(--danger);color:var(--danger);}
/* ── Recent picks ── */
.picks-list{display:flex;flex-direction:column;gap:0;}
.pick-item{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.pick-item:last-child{border-bottom:none;}
.pick-item-name{font-size:.95rem;font-weight:600;}
.pick-item-time{font-size:.75rem;color:var(--muted);}
/* ── Meal list ── */
.meal-item{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border);gap:10px;}
.meal-item:last-child{border-bottom:none;}
.meal-info{flex:1;min-width:0;}
.meal-item-name{font-size:.95rem;font-weight:600;line-height:1.3;cursor:pointer;color:var(--accent);}
.meal-item-name:hover{text-decoration:underline;}
.meal-item-tag{font-size:.7rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
.meal-votes{display:flex;gap:4px;align-items:center;}
.small-vote{padding:5px 9px;border-radius:8px;border:1px solid var(--border);background:var(--surface);
  font-size:.75rem;font-weight:700;font-family:var(--font);cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:all .15s;}
.small-vote.liked{background:#e8f5ee;border-color:var(--accent);color:var(--accent);}
.small-vote.disliked{background:#fdecea;border-color:var(--danger);color:var(--danger);}
.icon-btn{padding:6px 8px;border-radius:8px;border:1px solid var(--border);background:var(--surface);
  font-size:.8rem;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .15s;flex-shrink:0;}
.icon-btn:active{background:var(--bg);}
/* ── Section header ── */
.section-hdr{display:flex;align-items:center;justify-content:space-between;}
.section-title{font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
/* ── Weekly planner ── */
.week-grid{display:flex;flex-direction:column;gap:8px;}
.day-row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:12px 14px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .15s;}
.day-row:active{background:var(--bg);}
.day-label{font-size:.8rem;font-weight:700;color:var(--muted);width:36px;flex-shrink:0;text-transform:uppercase;}
.day-meal{flex:1;font-size:.95rem;font-weight:600;}
.day-meal.empty{color:var(--muted);font-weight:400;}
.day-clear{padding:4px 8px;background:none;border:none;font-size:1rem;cursor:pointer;
  -webkit-tap-highlight-color:transparent;color:var(--muted);flex-shrink:0;}
/* ── Shopping list ── */
.shop-group{margin-bottom:12px;}
.shop-group-title{font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:.06em;margin-bottom:6px;padding:0 2px;}
.shop-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);}
.shop-item:last-child{border-bottom:none;}
.shop-check{width:20px;height:20px;border-radius:6px;border:2px solid var(--border);
  flex-shrink:0;margin-top:1px;cursor:pointer;appearance:none;-webkit-appearance:none;background:var(--surface);}
.shop-check:checked{background:var(--accent);border-color:var(--accent);}
.shop-check:checked::after{content:"✓";color:#fff;font-size:.7rem;display:flex;align-items:center;justify-content:center;height:100%;}
.shop-text{font-size:.92rem;line-height:1.4;}
/* ── IO row ── */
.io-row{display:flex;gap:10px;}
.io-btn{flex:1;padding:12px;font-size:.82rem;font-weight:700;font-family:var(--font);
  border-radius:var(--radius);border:1.5px solid var(--border);background:var(--surface);
  color:var(--text);cursor:pointer;text-align:center;-webkit-tap-highlight-color:transparent;transition:all .15s;}
.io-btn:active{background:var(--bg);}
/* ── Modals ── */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .25s;}
.modal-backdrop.open{opacity:1;pointer-events:all;}
.modal-sheet{background:var(--surface);border-radius:20px 20px 0 0;
  width:100%;max-width:480px;max-height:92dvh;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.32,1,.65,1);}
.modal-backdrop.open .modal-sheet{transform:translateY(0);}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 0;}
.modal-header{padding:16px 20px 12px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);}
.modal-title{font-size:1.1rem;font-weight:800;letter-spacing:-.02em;}
.modal-close{padding:6px;border-radius:8px;border:none;background:none;font-size:1.3rem;
  cursor:pointer;color:var(--muted);-webkit-tap-highlight-color:transparent;}
.modal-body{padding:16px 20px;overflow-y:auto;flex:1;}
.modal-footer{padding:12px 20px max(env(safe-area-inset-bottom),12px);border-top:1px solid var(--border);display:flex;gap:10px;}
/* ── Servings toggle ── */
.servings-row{display:flex;gap:8px;margin-bottom:16px;}
.srv-btn{flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);
  font-size:.9rem;font-weight:700;font-family:var(--font);cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:all .15s;text-align:center;}
.srv-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
/* ── Recipe ── */
.recipe-section-title{font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:.06em;margin:14px 0 8px;}
.ingredient-list{list-style:none;display:flex;flex-direction:column;gap:4px;}
.ingredient-list li{font-size:.92rem;padding:6px 0;border-bottom:1px solid var(--border);display:flex;gap:8px;}
.ingredient-list li:last-child{border-bottom:none;}
.ing-qty{font-weight:700;color:var(--accent);min-width:60px;flex-shrink:0;}
.steps-list{list-style:none;display:flex;flex-direction:column;gap:10px;}
.steps-list li{font-size:.9rem;line-height:1.5;display:flex;gap:10px;}
.step-num{font-weight:800;color:var(--accent);min-width:22px;flex-shrink:0;}
/* ── Edit modal ── */
.form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.form-label{font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
.form-input{padding:12px 14px;font-size:1rem;font-family:var(--font);background:var(--surface);
  border:1.5px solid var(--border);border-radius:10px;color:var(--text);outline:none;
  -webkit-appearance:none;transition:border-color .15s;}
.form-input:focus{border-color:var(--accent);}
textarea.form-input{resize:vertical;min-height:80px;line-height:1.5;}
select.form-input{cursor:pointer;}
/* ── Meal picker modal ── */
.meal-picker-list{display:flex;flex-direction:column;gap:0;}
.mp-item{padding:13px 4px;border-bottom:1px solid var(--border);display:flex;align-items:center;
  gap:10px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .15s;}
.mp-item:last-child{border-bottom:none;}
.mp-item:active{background:var(--bg);}
.mp-item-name{flex:1;font-size:.95rem;font-weight:600;}
.mp-item-tag{font-size:.7rem;font-weight:600;color:var(--muted);text-transform:uppercase;}
/* ── Empty state ── */
.empty-state{padding:32px 16px;text-align:center;color:var(--muted);font-size:.9rem;}
/* ── Animations ── */
@keyframes pop-in{0%{transform:scale(.85);opacity:0}70%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
.animate{animation:pop-in .28s ease-out both;}
@keyframes fade-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fade-in .2s ease-out both;}
/* ── Notes badge ── */
.notes-badge{display:inline-block;background:#fff3cd;border:1px solid #ffc107;color:#856404;
  font-size:.65rem;font-weight:700;padding:2px 6px;border-radius:4px;margin-left:4px;vertical-align:middle;}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>Dinner Picker</h1>
    <div class="filter-scroll"><div class="filter-row" id="filterRow"></div></div>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('pick')" id="tab-pick">Pick</button>
    <button class="tab-btn" onclick="switchTab('meals')" id="tab-meals">Meals</button>
    <button class="tab-btn" onclick="switchTab('planner')" id="tab-planner">Planner</button>
  </div>

  <!-- PICK TAB -->
  <div class="tab-panel active" id="panel-pick">
    <div class="result-box" id="resultBox">
      <p class="result-placeholder" id="resultPlaceholder">Tap "Pick Dinner" to get a suggestion</p>
      <p class="result-name" id="resultName" style="display:none"></p>
      <p class="result-cuisine-tag" id="resultCuisineTag" style="display:none"></p>
      <div class="result-actions" id="resultActions" style="display:none">
        <button class="vote-btn" id="pickLikeBtn" onclick="voteCurrentPick(1)">👍 Like</button>
        <button class="vote-btn" id="pickDislikeBtn" onclick="voteCurrentPick(-1)">👎</button>
        <button class="btn-ghost icon-btn" id="viewRecipeBtn" onclick="openRecipeModal()">📖</button>
      </div>
    </div>
    <button class="btn-primary" id="pickBtn" onclick="pickDinner()">Pick Dinner</button>
    <button class="btn-secondary" id="notTonightBtn" onclick="notTonight()" style="display:none">Not Tonight — Try Again</button>

    <div id="recentSection" style="display:none">
      <div class="section-hdr" style="margin-bottom:8px;">
        <span class="section-title">Recent Picks</span>
        <button class="btn-ghost" style="font-size:.8rem;color:var(--muted)" onclick="clearHistory()">Clear</button>
      </div>
      <div class="card picks-list" id="recentList"></div>
    </div>
  </div>

  <!-- MEALS TAB -->
  <div class="tab-panel" id="panel-meals">
    <div class="filter-scroll"><div class="filter-row" id="filterRow2"></div></div>
    <div class="section-hdr">
      <span class="section-title">All Meals</span>
      <span class="section-title" id="mealCount"></span>
    </div>
    <div class="card" id="mealList"></div>
    <div class="io-row">
      <button class="io-btn" onclick="exportData()">Export JSON</button>
      <button class="io-btn" onclick="document.getElementById('importFile').click()">Import JSON</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)"/>
    </div>
  </div>

  <!-- PLANNER TAB -->
  <div class="tab-panel" id="panel-planner">
    <div class="section-hdr">
      <span class="section-title">Weekly Planner</span>
    </div>
    <div class="week-grid" id="weekGrid"></div>
    <button class="btn-primary" onclick="openShoppingList()">Generate Shopping List</button>
  </div>
</div>

<!-- RECIPE MODAL -->
<div class="modal-backdrop" id="recipeModal" onclick="handleModalBackdrop(event,'recipeModal')">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <span class="modal-title" id="recipeModalTitle"></span>
      <button class="modal-close" onclick="closeModal('recipeModal')">×</button>
    </div>
    <div class="modal-body">
      <div class="servings-row">
        <button class="srv-btn" onclick="setServings(2)">2 servings</button>
        <button class="srv-btn active" onclick="setServings(4)">4 servings</button>
        <button class="srv-btn" onclick="setServings(6)">6 servings</button>
      </div>
      <p class="recipe-section-title">Ingredients</p>
      <ul class="ingredient-list" id="recipeIngredients"></ul>
      <p class="recipe-section-title">Steps</p>
      <ol class="steps-list" id="recipeSteps"></ol>
    </div>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="modal-backdrop" id="editModal" onclick="handleModalBackdrop(event,'editModal')">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <span class="modal-title">Edit Meal</span>
      <button class="modal-close" onclick="closeModal('editModal')">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Meal Name</label>
        <input class="form-input" id="editName" type="text"/>
      </div>
      <div class="form-group">
        <label class="form-label">Cuisine</label>
        <select class="form-input" id="editCuisine"></select>
      </div>
      <div class="form-group">
        <label class="form-label">Personal Notes</label>
        <textarea class="form-input" id="editNotes" placeholder="e.g. double the garlic, use panko breadcrumbs…"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal('editModal')" style="flex:1">Cancel</button>
      <button class="btn-primary" onclick="saveEdit()" style="flex:2">Save</button>
    </div>
  </div>
</div>

<!-- MEAL PICKER MODAL (for planner) -->
<div class="modal-backdrop" id="mealPickerModal" onclick="handleModalBackdrop(event,'mealPickerModal')">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <span class="modal-title" id="mealPickerTitle">Choose a Meal</span>
      <button class="modal-close" onclick="closeModal('mealPickerModal')">×</button>
    </div>
    <div class="modal-body">
      <div class="filter-scroll" style="margin:0 -20px;padding:0 20px 12px;">
        <div class="filter-row" id="filterRow3"></div>
      </div>
      <div class="meal-picker-list" id="mealPickerList"></div>
    </div>
  </div>
</div>

<!-- SHOPPING LIST MODAL -->
<div class="modal-backdrop" id="shopModal" onclick="handleModalBackdrop(event,'shopModal')">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <span class="modal-title">Shopping List</span>
      <button class="modal-close" onclick="closeModal('shopModal')">×</button>
    </div>
    <div class="modal-body" id="shopModalBody"></div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="copyShoppingList()" style="flex:1">Copy</button>
      <button class="btn-primary" onclick="window.print()" style="flex:1">Print</button>
    </div>
  </div>
</div>
